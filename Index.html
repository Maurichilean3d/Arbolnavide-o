<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🎄 Low-Poly Xmas PRO</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>

<script type="module">
/* =========================
   IMPORTS (NETLIFY SAFE)
========================= */
import * as THREE from "https://unpkg.com/three@0.128.0/build/three.module.js";
import { EffectComposer } from "https://unpkg.com/three@0.128.0/examples/jsm/postprocessing/EffectComposer.js";
import { RenderPass } from "https://unpkg.com/three@0.128.0/examples/jsm/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "https://unpkg.com/three@0.128.0/examples/jsm/postprocessing/UnrealBloomPass.js";
import { RoomEnvironment } from "https://unpkg.com/three@0.128.0/examples/jsm/environments/RoomEnvironment.js";

/* =========================
   CONFIG
========================= */
const SETTINGS = {
  bloomStrength: 1.8,
  bloomRadius: 0.35,
  bloomThreshold: 0.05,
  exposure: 1.05,
  bulbs: 240,
  ornaments: 60,
  spin: 0.18
};

let scene, camera, renderer, composer, bloomPass;
let tree, star;

/* =========================
   INIT
========================= */
init();
animate();

function init() {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 1);

  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = SETTINGS.exposure;

  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 2.3, 9);
  camera.lookAt(0, 2.3, 0);

  // Environment map (reflejos sin HDR externo)
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  tree = createTree(scene.environment);
  scene.add(tree);

  setupLights();
  setupPost();

  window.addEventListener("resize", onResize);
}

/* =========================
   POSTPROCESS (BLOOM)
========================= */
function setupPost() {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));

  bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    SETTINGS.bloomStrength,
    SETTINGS.bloomRadius,
    SETTINGS.bloomThreshold
  );
  composer.addPass(bloomPass);
}

/* =========================
   LIGHTING
========================= */
function setupLights() {
  scene.add(new THREE.AmbientLight(0xffffff, 0.12));

  const spot = new THREE.SpotLight(0xffffff, 2.4, 40, Math.PI / 8, 0.35, 1);
  spot.position.set(3, 7, 8);
  spot.target.position.set(0, 2.3, 0);
  spot.castShadow = true;
  spot.shadow.mapSize.set(2048, 2048);
  spot.shadow.bias = -0.0003;
  scene.add(spot, spot.target);

  const rim = new THREE.DirectionalLight(0x66ccff, 0.28);
  rim.position.set(-6, 4, -6);
  scene.add(rim);
}

/* =========================
   TREE
========================= */
function createTree(env) {
  const g = new THREE.Group();

  // Tronco
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25, 0.38, 1.1, 7),
    new THREE.MeshStandardMaterial({ color: 0x6b3a18, roughness: 1, flatShading: true })
  );
  trunk.position.y = 0.55;
  trunk.castShadow = true;
  g.add(trunk);

  // Follaje
  const foliageMat = new THREE.MeshStandardMaterial({
    color: 0x0a5a2d,
    roughness: 0.92,
    metalness: 0.02,
    flatShading: true
  });

  const cones = [];
  for (let i = 0; i < 5; i++) {
    const r = 2.3 - i * 0.45;
    const h = 1.7 - i * 0.1;
    const y0 = 1.05 + i * 0.75;

    const geo = new THREE.ConeGeometry(r, h, 9, 1);
    jitter(geo, 0.025);

    const cone = new THREE.Mesh(geo, foliageMat);
    cone.position.y = y0 + h * 0.5;
    cone.castShadow = true;
    g.add(cone);

    cones.push({ r, h, y0, y1: y0 + h });
  }

  /* === LUCES === */
  const bulbs = [];
  const bulbGeo = new THREE.SphereGeometry(0.06, 14, 14);
  const colors = [0xff2d55, 0x00d2ff, 0xffd60a, 0x30d158, 0xbf5af2, 0xff9f0a];

  for (let i = 0; i < SETTINGS.bulbs; i++) {
    const c = new THREE.Color(colors[i % colors.length]);
    const mat = new THREE.MeshStandardMaterial({
      color: c,
      emissive: c,
      emissiveIntensity: 2.4,
      roughness: 0.3
    });

    const b = new THREE.Mesh(bulbGeo, mat);
    placeOnCone(b, cones);
    b.userData = {
      base: 1.8 + Math.random() * 1.5,
      speed: 1 + Math.random() * 2,
      phase: Math.random() * Math.PI * 2
    };
    g.add(b);
    bulbs.push(b);
  }

  /* === ORNAMENTOS REFLECTANTES === */
  const ornaments = [];
  const ornGeo = new THREE.SphereGeometry(0.13, 20, 20);
  const oColors = [0xff3b30, 0x34c759, 0x0a84ff, 0xffcc00];

  for (let i = 0; i < SETTINGS.ornaments; i++) {
    const mat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(oColors[i % oColors.length]),
      metalness: 1,
      roughness: 0.12,
      clearcoat: 1,
      clearcoatRoughness: 0.05,
      envMap: env,
      envMapIntensity: 1.2
    });

    const o = new THREE.Mesh(ornGeo, mat);
    placeOnCone(o, cones, 0.1);
    o.castShadow = true;
    g.add(o);
    ornaments.push(o);
  }

  /* === ESTRELLA === */
  star = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.23, 0),
    new THREE.MeshStandardMaterial({
      color: 0xfff2a6,
      emissive: 0xfff2a6,
      emissiveIntensity: 4.5,
      flatShading: true
    })
  );
  star.position.y = cones[cones.length - 1].y1 + 0.3;
  g.add(star);

  const halo = new THREE.PointLight(0xfff2a6, 1.2, 6);
  halo.position.copy(star.position);
  g.add(halo);

  g.userData = { bulbs, ornaments };
  return g;
}

/* =========================
   HELPERS
========================= */
function placeOnCone(mesh, cones, offset = 0.03) {
  const c = cones[Math.random() * cones.length | 0];
  const y = THREE.MathUtils.lerp(c.y0, c.y1, Math.random());
  const t = (y - c.y0) / c.h;
  const r = c.r * (1 - t) + offset;
  const a = Math.random() * Math.PI * 2;
  mesh.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
}

function jitter(geo, amt) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    p.setXYZ(
      i,
      p.getX(i) + (Math.random() - 0.5) * amt,
      p.getY(i) + (Math.random() - 0.5) * amt * 0.4,
      p.getZ(i) + (Math.random() - 0.5) * amt
    );
  }
  p.needsUpdate = true;
  geo.computeVertexNormals();
}

/* =========================
   ANIMATION
========================= */
function animate(t = 0) {
  requestAnimationFrame(animate);
  const time = t * 0.001;

  tree.rotation.y = Math.sin(time * SETTINGS.spin) * 0.3;

  tree.userData.bulbs.forEach(b => {
    const u = b.userData;
    b.material.emissiveIntensity =
      Math.max(0.7, u.base + Math.sin(time * u.speed + u.phase) * 1.2);
  });

  star.material.emissiveIntensity =
    3.8 + Math.sin(time * 2.2) * 1.3;
  star.rotation.y += 0.02;

  composer.render();
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloomPass.setSize(window.innerWidth, window.innerHeight);
}
</script>

</body>
</html>
